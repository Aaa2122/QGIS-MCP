[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis-agent-mcp"
version = "0.3.0"
description = "A high-capability Model Context Protocol runtime for a live QGIS session"
readme = {text = "A high-capability Model Context Protocol runtime for a live QGIS session.", content-type = "text/plain"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QGIS MCP contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.12"]

[project.scripts]
qgis-mcp = "qgis_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --ignore=tests/qgis"
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "benchmark-results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
